name: trade-prices

# Instant-buyout prices for the most-used cluster combos. Low volume: fixed search budget per run,
# paced under half of the announced limits, hard stop + persisted backoff on 429.
# Hourly (Oct 2026): 60 searches/run (~27 min) over the top 100 pairs + 30 three-notable combos x 2 ilvl tiers.
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      budget:
        description: Searches this run
        required: false
        default: '60'

concurrency:
  group: trade-prices
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    defaults:
      run:
        working-directory: collectors
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: collectors/package-lock.json
      - run: npm ci
      - run: npm test
      - run: node trade-prices.mjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POESESSID: ${{ secrets.POESESSID }}
          BUDGET: ${{ inputs.budget || '60' }}
          TOP: '100'
          TOP3: '30'
