name: ninja-builds

# Cluster notable usage from poe.ninja builds. Internal API: kept at low volume (~40 paced requests per run).
on:
  schedule:
    - cron: '41 3,15 * * *'
  workflow_dispatch:
    inputs:
      time_machine:
        description: Time machine label (current, day-1, week-2, ...)
        required: false
        default: current
      top_notables:
        description: How many notables to search for co-occurrence
        required: false
        default: '40'

concurrency:
  group: ninja-builds
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: collectors
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: collectors/package-lock.json
      - run: npm ci
      - run: npm test
      - run: node ninja-builds.mjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TIME_MACHINE: ${{ inputs.time_machine || 'current' }}
          TOP_NOTABLES: ${{ inputs.top_notables || '40' }}
